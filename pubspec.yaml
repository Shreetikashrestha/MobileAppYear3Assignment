name: influcollb_app
description: "A new Flutter project for InfluCollab - Connect Influencers with Brands"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get: ^4.6.5
  flutter_riverpod: ^2.4.0
  shared_preferences: ^2.2.2
  dio: ^5.7.0
  connectivity_plus: ^7.0.0
  dartz: ^0.10.1
  path_provider: ^2.1.1
  uuid: ^4.5.2
  dio_smart_retry: ^6.0.0
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  geolocator: ^10.1.0
  http: ^1.1.0
  path: ^1.8.3
  # Firebase for Push Notifications (Temporarily disabled for build)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.2.3
  # Share functionality
  share_plus: ^7.2.1
  # Animations
  lottie: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  # Biometric Authentication
  local_auth: ^2.2.0
  # Maps
  google_maps_flutter: ^2.5.0
  # Charts
  fl_chart: ^0.65.0
  # Socket.io for real-time messaging
  socket_io_client: ^2.0.3+1
  # CSV export for analytics
  csv: ^6.0.0
  # Percent indicator for analytics
  percent_indicator: ^4.2.3

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700


